name: Deploy to Ionos via SFTP

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

    - name: Compile Frontend Assets (NPM)
      run: |
        npm install
        npm run build

    - name: Remove files excluded from deployment
      run: rm -rf .git .github node_modules .env .env.example README.md phpunit.xml tests/

    - name: SFTP Deploy (Smart Sync)
      env:
        SSHPASS: ${{ secrets.SFTP_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass rsync
        sshpass -e rsync -avzc -e "ssh -o StrictHostKeyChecking=no -p 22" ./ ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_SERVER }}:./bandamusicamoratalla
