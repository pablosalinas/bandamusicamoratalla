name: Deploy to Ionos via SFTP

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

    - name: Compile Frontend Assets (NPM)
      run: |
        npm install
        npm run build

    - name: SFTP Deploy
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        server: ${{ secrets.SFTP_SERVER }}
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
        local_path: './'
        sftpArgs: '-o StrictHostKeyChecking=no'
        exclude: '**.git*/**,**node_modules/**,.env,.env.example,README.md,phpunit.xml,tests/**'
